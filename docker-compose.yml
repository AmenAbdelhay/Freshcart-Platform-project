# =============================================================================
# FreshCart: THE COMPANY (its database, its business, its exchange-rate provider)
# Do not change these three services. Add YOUR data platform below them
# (warehouse, loaders, dbt, Airflow...): containers in this file can reach the
# company by name: source-db:5432, fx-api:8000.
# =============================================================================
services:
  # ---------------------------------------------------------------- the company's database
  source-db:
    image: postgres:16
    container_name: freshcart-source-db
    environment:
      POSTGRES_DB: freshcart_source
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      TZ: Africa/Cairo                      # show times in Cairo time
      PGTZ: Africa/Cairo
    ports:
      - "5433:5432"
    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./source_db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:                            # "healthy" = ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_DB_USER} -d freshcart_source"]
      interval: 5s
      retries: 20

  # ---------------------------------------------------------------- keeps the company alive
  simulator:
    build: ./simulator
    container_name: freshcart-simulator
    environment:
      SOURCE_DB_HOST: source-db
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      COURSE_START_DATE: ${COURSE_START_DATE}
      COURSE_END_DATE: ${COURSE_END_DATE}
      HISTORY_DAYS: ${HISTORY_DAYS}
      ORDERS_PER_DAY: ${ORDERS_PER_DAY}
      N_CUSTOMERS: ${N_CUSTOMERS}
      N_PRODUCTS: ${N_PRODUCTS}
      SIM_SEED: ${SIM_SEED}
      SIM_FAKE_NOW: ${SIM_FAKE_NOW:-}
      SUPPLIER_DIR: /data/suppliers
      SOURCE_READER_PASSWORD: ${SOURCE_READER_PASSWORD}   # creates the read-only account
    volumes:
      - ./source_files/suppliers:/data/suppliers   # supplier files land in this project folder
    depends_on:
      source-db:
        condition: service_healthy          # wait until the database is ready
    restart: unless-stopped                 # starts again automatically with Docker

  # ---------------------------------------------------------------- external exchange-rate provider
  fx-api:
    build: ./simulator                      # same image as the simulator (same FX formula)
    container_name: freshcart-fx-api
    command: ["fx-api"]
    environment:
      SIM_SEED: ${SIM_SEED}
      COURSE_START_DATE: ${COURSE_START_DATE}
      SIM_FAKE_NOW: ${SIM_FAKE_NOW:-}
      FX_API_KEY: ${FX_API_KEY}
    ports:
      - "8000:8000"                         # from your laptop: http://localhost:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped


  # ---------------------------------------------------------------- YOUR PLATFORM STARTS HERE
#-------------------------------------Warehouse---------------------------
  warehouse:                                  
    image: postgres:16
    environment:
      POSTGRES_USER: fresh_wh
      POSTGRES_PASSWORD: fresh_password
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - wh_data:/var/lib/postgresql/data

#-------------------------------------DBT---------------------------
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: freshcart-dbt
    working_dir: /usr/app/freshcart_dbt
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "8081:8081"
    volumes:
      - ./dbt/freshcart_dbt:/usr/app/freshcart_dbt
      - ./dbt/profiles:/root/.dbt:ro
    depends_on:
      - warehouse

#-------------------------------------AIRFLOW---------------------------
  airflow:
    image: apache/airflow:3.1.5
    container_name: freshcart-airflow
    restart: unless-stopped

    command: standalone

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PROD_HOST: source-db
      PROD_PORT: "5432"

      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"

      FX_API_URL: http://fx-api:8000

      SUPPLIERS_DIR: /opt/airflow/suppliers

      # Gmail SMTP Configuration
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_USER}
      AIRFLOW_CONN_SMTP_DEFAULT: "smtp://${AIRFLOW_SMTP_USER}:${AIRFLOW_SMTP_PASSWORD}@smtp.gmail.com:587"
      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}

      # Airflow Email Backend
      AIRFLOW__EMAIL__EMAIL_BACKEND: airflow.utils.email.send_email_smtp

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./etl:/opt/airflow/etl:ro
      - ./source_files/suppliers:/opt/airflow/suppliers:ro
      - ./.env:/opt/airflow/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock



volumes:
  source_db_data:
  wh_data:

